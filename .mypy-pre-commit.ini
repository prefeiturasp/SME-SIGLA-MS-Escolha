# Configuração do mypy usada pelo hook do pre-commit.
# Ambiente isolado (sem django-stubs); `make pep484` continua usando
# [tool.mypy] do pyproject.toml com os plugins Django.
[mypy]
python_version = 3.12
exclude = (?x)(
    .*/migrations/.*
    | .venv/
    | venv/
    | htmlcov/
  )
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
disable_error_code = return-value, no-any-return

[mypy-*.tests.*]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
ignore_errors = true

[mypy-*.migrations.*]
ignore_errors = true

[mypy-config.*]
ignore_errors = true

[mypy-manage]
ignore_errors = true

[mypy-conftest]
ignore_errors = true

[mypy-apps.conftest]
ignore_errors = true
